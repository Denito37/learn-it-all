[project]
name = "learn-it-all"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Denito37", email = "69406178+Denito37@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "openrouter>=1.3.56",
    "requests>=2.34.2",
]

[project.scripts]
learn-it-all = "learn_it_all:main"

[build-system]
